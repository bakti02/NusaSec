<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NusaSec — Product Workspace</title><link rel="stylesheet" href="./design-tokens.css"><link rel="stylesheet" href="./styles.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">Nusa<span>Sec</span><small>CONTROL TOWER</small></div><nav class="nav"><a href="./">⌂ Overview</a><a href="./products.html">□ Products</a><a href="./billing.html">◇ Billing</a><a href="../login/" data-action="logout">Log out</a></nav></aside><main class="main"><header class="topbar"><div class="crumb"><span>Products</span><b>/</b><strong>Workspace</strong></div><div class="avatar">NS</div></header><div class="content" id="product-root"><div class="core-empty">Loading product workspace from NusaSec Core…</div></div></main></div><script type="module" src="./app.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const root=document.getElementById('product-root'); const code=new URLSearchParams(location.search).get('code'); if(code){window.NusaSec.api('/v1/products/'+encodeURIComponent(code)+'/workspace').then(d=>{const p=d.product||d;root.innerHTML='<section class="page-head"><div><div class="eyebrow">PRODUCT WORKSPACE</div><h1>'+esc(p.display_name||p.name||code)+'</h1><p>'+esc(p.short_description||p.description||p.outcome||'')+'</p></div></section><section class="grid-two"><article class="card"><div class="section-kicker">STATUS</div><h2>'+esc(p.status||'Core connected')+'</h2><p class="muted">Workspace state returned by the canonical product API.</p></article><article class="card"><div class="section-kicker">ENTITLEMENT</div><h2>'+esc(p.plan||p.plan_code||'—')+'</h2><p class="muted">Plan and usage details remain Core-owned.</p></article></section>'}).catch(()=>root.innerHTML='<div class="core-empty"><strong>Product workspace unavailable.</strong><span>The requested product is not available or Core is not connected.</span></div>')}else root.innerHTML='<div class="core-empty"><strong>No product selected.</strong><span>Return to Products and select a workspace.</span></div>';</script></body></html>
