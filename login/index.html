<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NusaSec — Login</title><link rel="stylesheet" href="/web/styles.css"></head><body><main style="max-width:420px;margin:10vh auto;padding:24px"><div class="card"><h1>Sign in to NusaSec</h1><form id="login"><label>Email<br><input name="email" type="email" required style="width:100%;padding:10px;margin:8px 0 16px"></label><label>Password<br><input name="password" type="password" required style="width:100%;padding:10px;margin:8px 0 16px"></label><button class="btn" type="submit">Sign in</button><p id="error" class="muted"></p></form></div></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(Object.fromEntries(f))});if(r.ok)location.href='/web/';else document.querySelector('#error').textContent='Login failed';});</script></body></html>
