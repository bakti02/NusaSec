name: Deploy NusaSec preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare complete frontend preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R web _site/web
          cp -R login _site/login
          if [ -d internal ]; then cp -R internal _site/internal; fi
          if [ -d design ]; then cp -R design _site/design; fi
          if [ -d shared ]; then cp -R shared _site/shared; fi

          # Rewrite only the temporary Pages artifact. Production source files
          # and API paths are never changed. Each directory gets paths relative
          # to its own location so repository-subpath hosting works correctly.
          find _site -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i \
                -e 's#href="/site/#href="./#g' \
                -e 's#src="/site/#src="./#g' \
                -e 's#href="/web/#href="./web/#g' \
                -e 's#href="/login/#href="./login/#g' \
                -e 's#href="/internal/#href="./internal/#g' \
                -e 's#href="/design/#href="./design/#g' \
                -e 's#href="/shared/#href="./shared/#g'

          find _site/web -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i \
                -e 's#href="/web/#href="./#g' \
                -e 's#src="/web/#src="./#g' \
                -e 's#href="/login/#href="../login/#g' \
                -e 's#href="/internal/#href="../internal/#g'

          find _site/login -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i \
                -e 's#href="/web/#href="../web/#g' \
                -e 's#href="/site/#href="../#g'

          if [ -d _site/internal ]; then
            find _site/internal -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
              | xargs -0 sed -i \
                  -e 's#href="/internal/#href="./#g' \
                  -e 's#src="/internal/#src="./#g' \
                  -e 's#href="/login/#href="../login/#g'
          fi

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
