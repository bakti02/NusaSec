name: Deploy NusaSec preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare complete frontend preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R web _site/web
          cp -R login _site/login
          if [ -d internal ]; then cp -R internal _site/internal; fi
          if [ -d design ]; then cp -R design _site/design; fi
          if [ -d shared ]; then cp -R shared _site/shared; fi

          # Keep source code untouched; only rewrite paths in the temporary
          # Pages artifact so repository-subpath URLs resolve correctly.
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i \
                -e 's#href="/site/#href="./#g' \
                -e 's#src="/site/#src="./#g' \
                -e "s#href='/site/#href='./#g" \
                -e "s#src='/site/#src='./#g"

          find _site/web -maxdepth 2 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i \
                -e 's#href="/web/#href="./#g' \
                -e 's#src="/web/#src="./#g' \
                -e "s#href='/web/#href='./#g" \
                -e "s#src='/web/#src='./#g"

          find _site -maxdepth 2 -type f \( -name '*.html' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i \
                -e 's#href="/login/#href="./login/#g' \
                -e 's#href="/web/#href="./web/#g' \
                -e 's#href="/internal/#href="./internal/#g'

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
